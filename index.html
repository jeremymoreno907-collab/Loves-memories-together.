<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>A Universe Made of Us</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#05020c;
    --pink:#ff5da2;
    --gold:#ffd27a;
    --glow:#fff6fb;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; height:100%; width:100%;
    background:var(--void);
    overflow:hidden;
    font-family:'Nunito Sans', sans-serif;
    color:var(--glow);
  }
  #scene{ position:fixed; inset:0; display:block; touch-action:none; }

  #intro{
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:28px;
    background: radial-gradient(ellipse at 50% 38%, #1c0c30 0%, #05020c 68%);
    z-index:10;
    transition: opacity 1s ease, visibility 1s ease;
  }
  #intro.hidden{ opacity:0; visibility:hidden; pointer-events:none; }
  #intro h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-size: clamp(2.1rem, 8vw, 3.4rem);
    line-height:1.15;
    margin:0 0 16px;
    background: linear-gradient(180deg, #ffffff 0%, #ffd6ec 55%, var(--pink) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow: 0 0 50px rgba(255,93,162,.35);
  }
  #intro p{
    max-width:340px; font-size:1rem; line-height:1.65;
    color:#e9dcef; opacity:.85; margin:0 0 36px;
  }
  #enter-btn{
    font-family:'Nunito Sans', sans-serif; font-weight:700; font-size:.95rem;
    letter-spacing:.02em; color:#2a0620;
    background: linear-gradient(135deg, #ffd6ec, var(--pink));
    border:none; padding:15px 36px; border-radius:999px; cursor:pointer;
    box-shadow: 0 0 0 1px rgba(255,255,255,.28) inset, 0 8px 30px rgba(255,93,162,.45);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  #enter-btn:hover{ transform:translateY(-2px); box-shadow:0 0 0 1px rgba(255,255,255,.32) inset, 0 12px 38px rgba(255,93,162,.6); }
  #enter-btn:active{ transform:translateY(0); }
  #enter-btn:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }

  #hint{
    position:fixed; bottom:28px; left:0; right:0; text-align:center;
    font-size:.82rem; letter-spacing:.02em; color:#e9dcef; opacity:0;
    transition:opacity 1.1s ease; pointer-events:none; z-index:5;
  }
  #hint.show{ opacity:.68; }

  #modal{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background: rgba(5,2,12,.82); backdrop-filter: blur(6px);
    opacity:0; visibility:hidden; transition: opacity .35s ease, visibility .35s ease;
    z-index:20; padding:26px;
  }
  #modal.show{ opacity:1; visibility:visible; }
  .card{
    max-width:420px; width:100%;
    background: linear-gradient(180deg, #190a26, #0c0416);
    border:1px solid rgba(255,168,210,.25);
    border-radius:22px; padding:16px 16px 24px;
    box-shadow: 0 0 70px rgba(185,60,255,.22), 0 24px 60px rgba(0,0,0,.6);
    position:relative;
    transform: scale(.92) translateY(10px);
    transition: transform .4s cubic-bezier(.2,.9,.25,1.1);
  }
  #modal.show .card{ transform:scale(1) translateY(0); }
  .card img{ width:100%; border-radius:14px; display:block; object-fit:cover; max-height:58vh; }
  .card p{
    font-family:'Cormorant Garamond', serif; font-size:1.28rem; font-style:italic;
    text-align:center; margin:18px 8px 4px; color:#ffe7f4; line-height:1.4;
  }
  #close-btn{
    position:absolute; top:-14px; right:-14px; width:36px; height:36px; border-radius:50%;
    background:var(--pink); color:#2a0620; border:none; font-size:1.15rem; line-height:1;
    cursor:pointer; box-shadow:0 6px 20px rgba(255,93,162,.5);
  }
  #close-btn:focus-visible{ outline:2px solid var(--gold); }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }
</style>
</head>
<body>

  <canvas id="scene"></canvas>

  <div id="intro">
    <h1>A Universe Made of Us</h1>
    <p>Every star in this sky holds a memory of you. Step in and look around.</p>
    <button id="enter-btn">Enter Our Universe</button>
  </div>

  <div id="hint">Drag to look around · tap a star to relive a memory</div>

  <div id="modal">
    <div class="card">
      <button id="close-btn" aria-label="Close">&#10005;</button>
      <img id="modal-img" src="" alt="A shared memory">
      <p id="modal-caption"></p>
    </div>
  </div>

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05020c);
  scene.fog = new THREE.FogExp2(0x05020c, 0.0075);

  var camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);

  scene.add(new THREE.AmbientLight(0x553366, 0.7));
  var coreLight = new THREE.PointLight(0xff8fc4, 3.4, 100, 2);
  coreLight.position.set(0, 3, 0);
  scene.add(coreLight);

  // ---------- helpers ----------
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function makeGlowSprite(innerColor, midColor, size) {
    var c = document.createElement('canvas');
    c.width = c.height = 256;
    var ctx = c.getContext('2d');
    var g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
    g.addColorStop(0, innerColor);
    g.addColorStop(0.35, midColor);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 256, 256);
    var tex = new THREE.CanvasTexture(c);
    var mat = new THREE.SpriteMaterial({ map: tex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
    var spr = new THREE.Sprite(mat);
    spr.scale.set(size, size, 1);
    return spr;
  }

  function makeBeamSprite() {
    var c = document.createElement('canvas');
    c.width = 64; c.height = 256;
    var ctx = c.getContext('2d');
    var g = ctx.createLinearGradient(0, 256, 0, 0);
    g.addColorStop(0, 'rgba(255,255,255,0.85)');
    g.addColorStop(0.4, 'rgba(255,120,190,0.45)');
    g.addColorStop(1, 'rgba(255,120,190,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 64, 256);
    var tex = new THREE.CanvasTexture(c);
    var mat = new THREE.SpriteMaterial({ map: tex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
    var spr = new THREE.Sprite(mat);
    spr.scale.set(2.6, 13, 1);
    spr.position.set(0, 6.4, 0);
    return spr;
  }

  function makeTextSprite(text) {
    var fontSize = 56;
    var font = "italic 500 " + fontSize + "px Georgia, 'Times New Roman', serif";
    var measureCanvas = document.createElement('canvas');
    var mctx = measureCanvas.getContext('2d');
    mctx.font = font;
    var textWidth = mctx.measureText(text).width;
    var padding = 44;
    var canvas = document.createElement('canvas');
    canvas.width = Math.ceil(textWidth) + padding * 2;
    canvas.height = Math.ceil(fontSize * 1.8);
    var ctx = canvas.getContext('2d');
    ctx.font = font;
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(255,140,195,0.9)';
    ctx.shadowBlur = 20;
    ctx.fillStyle = 'rgba(255,238,247,0.95)';
    ctx.fillText(text, padding, canvas.height / 2);
    var tex = new THREE.CanvasTexture(canvas);
    var mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
    var sprite = new THREE.Sprite(mat);
    var scaleFactor = 0.013;
    sprite.scale.set(canvas.width * scaleFactor, canvas.height * scaleFactor, 1);
    return sprite;
  }

  function makeFramedTexture(src, callback) {
    var img = new Image();
    img.onload = function () {
      var size = 512, pad = 24, r = 34;
      var canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      var ctx = canvas.getContext('2d');
      roundRect(ctx, 0, 0, size, size, 44);
      ctx.fillStyle = 'rgba(255,255,255,0.14)';
      ctx.fill();
      ctx.save();
      roundRect(ctx, pad, pad, size - pad * 2, size - pad * 2, r);
      ctx.clip();
      var innerSize = size - pad * 2;
      var scale = Math.max(innerSize / img.width, innerSize / img.height);
      var w = img.width * scale, h = img.height * scale;
      ctx.drawImage(img, pad + (innerSize - w) / 2, pad + (innerSize - h) / 2, w, h);
      ctx.restore();
      roundRect(ctx, pad, pad, size - pad * 2, size - pad * 2, r);
      ctx.lineWidth = 6;
      ctx.strokeStyle = 'rgba(255,214,236,0.9)';
      ctx.stroke();
      var tex = new THREE.CanvasTexture(canvas);
      tex.needsUpdate = true;
      callback(tex);
    };
    img.src = src;
  }

  // ---------- starfield ----------
  function makeStars(count, radius, size, color, opacity) {
    var geo = new THREE.BufferGeometry();
    var pos = new Float32Array(count * 3);
    for (var i = 0; i < count; i++) {
      var r = radius * (0.35 + Math.random() * 0.65);
      var theta = Math.random() * Math.PI * 2;
      var phi = Math.acos((Math.random() * 2) - 1);
      pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      pos[i * 3 + 1] = r * Math.cos(phi) * 0.55;
      pos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    var mat = new THREE.PointsMaterial({ color: color, size: size, transparent: true, opacity: opacity, depthWrite: false });
    return new THREE.Points(geo, mat);
  }
  scene.add(makeStars(2600, 230, 0.7, 0xffffff, 0.85));
  scene.add(makeStars(500, 150, 1.5, 0xffd6ec, 0.7));

  // ---------- galaxy disk ----------
  function makeGalaxyDisk() {
    var count = 5200;
    var geo = new THREE.BufferGeometry();
    var pos = new Float32Array(count * 3);
    var col = new Float32Array(count * 3);
    var cInner = new THREE.Color(0xffffff);
    var cMid = new THREE.Color(0xff6fb0);
    var cOuter = new THREE.Color(0x8a2be2);
    var arms = 3;
    for (var i = 0; i < count; i++) {
      var t = Math.random();
      var radius = 3 + t * 26;
      var armOffset = (i % arms) * (Math.PI * 2 / arms);
      var spin = radius * 0.22;
      var angle = armOffset + spin + (Math.random() - 0.5) * 0.5;
      var spread = (1 - t) * 1.2 + 0.3;
      var x = Math.cos(angle) * radius + (Math.random() - 0.5) * spread;
      var z = Math.sin(angle) * radius + (Math.random() - 0.5) * spread;
      var y = (Math.random() - 0.5) * 0.6 * (1 - t * 0.7);
      pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z;
      var mixed = t < 0.5 ? cInner.clone().lerp(cMid, t * 2) : cMid.clone().lerp(cOuter, (t - 0.5) * 2);
      col[i * 3] = mixed.r; col[i * 3 + 1] = mixed.g; col[i * 3 + 2] = mixed.b;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    var mat = new THREE.PointsMaterial({ size: 0.34, vertexColors: true, transparent: true, opacity: 0.9, depthWrite: false, blending: THREE.AdditiveBlending });
    return new THREE.Points(geo, mat);
  }
  var disk = makeGalaxyDisk();
  scene.add(disk);

  scene.add(makeGlowSprite('rgba(255,255,255,0.95)', 'rgba(255,143,196,0.85)', 20));
  scene.add(makeBeamSprite());

  // ---------- heart nebula ----------
  function heartPoint(t) {
    var x = 16 * Math.pow(Math.sin(t), 3);
    var y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    return { x: x, y: y };
  }
  function makeHeart() {
    var count = 2200;
    var geo = new THREE.BufferGeometry();
    var pos = new Float32Array(count * 3);
    var col = new Float32Array(count * 3);
    var cCenter = new THREE.Color(0xffffff);
    var cEdge = new THREE.Color(0xff4fa0);
    for (var i = 0; i < count; i++) {
      var t = Math.random() * Math.PI * 2;
      var p = heartPoint(t);
      var fillT = Math.random();
      var scale = 0.42;
      var x = p.x * scale * fillT;
      var y = p.y * scale * fillT;
      var z = (Math.random() - 0.5) * 1.6;
      pos[i * 3] = x; pos[i * 3 + 1] = y + 12.5; pos[i * 3 + 2] = z;
      var mixed = cCenter.clone().lerp(cEdge, fillT);
      col[i * 3] = mixed.r; col[i * 3 + 1] = mixed.g; col[i * 3 + 2] = mixed.b;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    var mat = new THREE.PointsMaterial({ size: 0.32, vertexColors: true, transparent: true, opacity: 0.95, depthWrite: false, blending: THREE.AdditiveBlending });
    return new THREE.Points(geo, mat);
  }
  var heart = makeHeart();
  scene.add(heart);

  // ---------- floating phrases ----------
  var labelGroup = new THREE.Group();
  scene.add(labelGroup);
  PHRASES.forEach(function (text, i) {
    var sprite = makeTextSprite(text);
    var radius = 27 + Math.random() * 9;
    var angle = (i / PHRASES.length) * Math.PI * 2 + Math.random() * 0.4;
    var y = Math.random() * 3 - 1;
    sprite.position.set(Math.cos(angle) * radius, y, Math.sin(angle) * radius);
    labelGroup.add(sprite);
  });

  // ---------- memory planets ----------
  var memoryGroup = new THREE.Group();
  scene.add(memoryGroup);
  var memoryNodes = [];
  var clickable = [];
  var orbitRadii = [10, 13, 16.5, 20, 23.5, 27];

  MEMORIES.forEach(function (mem, i) {
    var node = new THREE.Group();

    var halo = makeGlowSprite('rgba(255,255,255,0.9)', 'rgba(255,150,205,0.75)', 5.6);
    node.add(halo);

    var photoMat = new THREE.SpriteMaterial({ transparent: true });
    var photoSprite = new THREE.Sprite(photoMat);
    photoSprite.scale.set(4.2, 4.2, 1);
    photoSprite.userData.index = i;
    node.add(photoSprite);
    clickable.push(photoSprite);

    makeFramedTexture(mem.src, function (tex) {
      photoMat.map = tex;
      photoMat.needsUpdate = true;
    });

    var radius = orbitRadii[i % orbitRadii.length];
    var angle = (i / MEMORIES.length) * Math.PI * 2;
    var speed = 0.075 + (i % 3) * 0.014;
    var y0 = -1.5 + (i % 4) * 1.0;

    memoryGroup.add(node);
    memoryNodes.push({ node: node, radius: radius, angle: angle, speed: speed, y0: y0, phase: Math.random() * Math.PI * 2 });
  });

  // ---------- camera controls (custom, no external deps) ----------
  var target = new THREE.Vector3(0, 3, 0);
  var spherical = { radius: 44, theta: 0.6, phi: 1.15 };
  var minRadius = 15, maxRadius = 85;
  var isDragging = false, dragged = false;
  var downX = 0, downY = 0, lastX = 0, lastY = 0;
  var autoRotate = true;
  var autoRotateSpeed = 0.045;

  function updateCameraFromSpherical() {
    var sinPhiR = spherical.radius * Math.sin(spherical.phi);
    camera.position.x = target.x + sinPhiR * Math.sin(spherical.theta);
    camera.position.y = target.y + spherical.radius * Math.cos(spherical.phi);
    camera.position.z = target.z + sinPhiR * Math.cos(spherical.theta);
    camera.lookAt(target);
  }
  updateCameraFromSpherical();

  canvas.addEventListener('pointerdown', function (e) {
    isDragging = true; dragged = false;
    downX = lastX = e.clientX; downY = lastY = e.clientY;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!isDragging) return;
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    if (Math.hypot(e.clientX - downX, e.clientY - downY) > 4) dragged = true;
    spherical.theta -= dx * 0.0055;
    spherical.phi -= dy * 0.0055;
    spherical.phi = Math.max(0.28, Math.min(Math.PI - 0.35, spherical.phi));
    lastX = e.clientX; lastY = e.clientY;
    updateCameraFromSpherical();
  });
  window.addEventListener('pointerup', function (e) {
    if (isDragging && !dragged) handleTap(e.clientX, e.clientY);
    isDragging = false;
  });
  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    spherical.radius += e.deltaY * 0.03;
    spherical.radius = Math.max(minRadius, Math.min(maxRadius, spherical.radius));
    updateCameraFromSpherical();
  }, { passive: false });

  var pinchStartDist = null, pinchStartRadius = null;
  canvas.addEventListener('touchmove', function (e) {
    if (e.touches.length === 2) {
      e.preventDefault();
      var dx = e.touches[0].clientX - e.touches[1].clientX;
      var dy = e.touches[0].clientY - e.touches[1].clientY;
      var dist = Math.hypot(dx, dy);
      if (pinchStartDist === null) { pinchStartDist = dist; pinchStartRadius = spherical.radius; }
      else {
        var ratio = pinchStartDist / dist;
        spherical.radius = Math.max(minRadius, Math.min(maxRadius, pinchStartRadius * ratio));
        updateCameraFromSpherical();
      }
    }
  }, { passive: false });
  canvas.addEventListener('touchend', function (e) {
    if (e.touches.length < 2) pinchStartDist = null;
  });

  // ---------- raycasting / tap to open memory ----------
  var raycaster = new THREE.Raycaster();
  var pointerV = new THREE.Vector2();
  function handleTap(x, y) {
    pointerV.x = (x / window.innerWidth) * 2 - 1;
    pointerV.y = -(y / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointerV, camera);
    var hits = raycaster.intersectObjects(clickable, false);
    if (hits.length) openModal(hits[0].object.userData.index);
  }

  // ---------- modal ----------
  var modal = document.getElementById('modal');
  var modalImg = document.getElementById('modal-img');
  var modalCaption = document.getElementById('modal-caption');
  var closeBtn = document.getElementById('close-btn');
  function openModal(i) {
    var mem = MEMORIES[i];
    modalImg.src = mem.src;
    modalCaption.textContent = mem.caption;
    modal.classList.add('show');
    autoRotate = false;
  }
  function closeModal() {
    modal.classList.remove('show');
    autoRotate = true;
  }
  closeBtn.addEventListener('click', closeModal);
  modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });

  // ---------- intro ----------
  var intro = document.getElementById('intro');
  var enterBtn = document.getElementById('enter-btn');
  var hint = document.getElementById('hint');
  enterBtn.addEventListener('click', function () {
    intro.classList.add('hidden');
    setTimeout(function () { hint.classList.add('show'); }, 900);
    setTimeout(function () { hint.classList.remove('show'); }, 6500);
  });

  // ---------- resize ----------
  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------- animate ----------
  var lastTime = performance.now();
  function animate() {
    requestAnimationFrame(animate);
    var now = performance.now();
    var delta = (now - lastTime) / 1000;
    lastTime = now;
    if (delta > 0.1) delta = 0.1;

    disk.rotation.y += delta * 0.03;
    heart.rotation.y -= delta * 0.06;
    var pulse = 1 + Math.sin(now * 0.0018) * 0.05;
    heart.scale.set(pulse, pulse, pulse);

    memoryNodes.forEach(function (m) {
      m.angle += delta * m.speed;
      m.node.position.set(
        Math.cos(m.angle) * m.radius,
        m.y0 + Math.sin(now * 0.0007 + m.phase) * 1.0,
        Math.sin(m.angle) * m.radius
      );
    });

    labelGroup.rotation.y += delta * 0.015;

    if (!isDragging && autoRotate) {
      spherical.theta += autoRotateSpeed * delta;
      updateCameraFromSpherical();
    }

    renderer.render(scene, camera);
  }
  animate();

})();
</script>
</body>
</html>
